name: News headline collection

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-headline-collection
  cancel-in-progress: false

jobs:
  collect-headlines:
    if: github.event_name == 'workflow_dispatch' || vars.THESISBOARD_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THESISBOARD_DATABASE_URL: ${{ secrets.THESISBOARD_DATABASE_URL }}
      THESISBOARD_WATCHLIST: ${{ vars.THESISBOARD_WATCHLIST }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Require durable storage
        run: |
          if [ -z "$THESISBOARD_DATABASE_URL" ]; then
            echo "THESISBOARD_DATABASE_URL is required for scheduled collection."
            exit 1
          fi

      - name: Capture immutable headline snapshot
        run: python scripts/collect_news.py --require-durable
