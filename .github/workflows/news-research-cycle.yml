name: News research cycle

on:
  schedule:
    # 23:30 UTC is after 6:30 p.m. New York in both daylight and standard time.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-research-cycle
  cancel-in-progress: false

jobs:
  calibrate-settled-labels:
    if: github.event_name == 'workflow_dispatch' || vars.THESISBOARD_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THESISBOARD_DATABASE_URL: ${{ secrets.THESISBOARD_DATABASE_URL }}
      THESISBOARD_WATCHLIST: ${{ vars.THESISBOARD_WATCHLIST }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Require durable storage
        run: |
          if [ -z "$THESISBOARD_DATABASE_URL" ]; then
            echo "THESISBOARD_DATABASE_URL is required for scheduled calibration."
            exit 1
          fi

      - name: Run settled-label research cycle
        run: python scripts/run_research_cycle.py --require-durable
